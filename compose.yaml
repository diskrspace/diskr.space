services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: diskrspace
      POSTGRES_USER: diskrspace
      POSTGRES_PASSWORD: diskrspace
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diskrspace"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: .
    environment:
      DISKRSPACE_DB_URI: postgresql+psycopg2://diskrspace:diskrspace@postgres/diskrspace
    volumes:
      - ${DISKRSPACE_SCAN_DIR:-.}:/data
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "1888:80"
    depends_on:
      - backend

volumes:
  postgres-data:
